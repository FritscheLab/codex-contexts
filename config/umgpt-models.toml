# Model defaults and preferred order for the two U-M GPT identities.
# Start here: ../MODELS.md (settings, prices, context windows, benchmarks).
#
# Maintainers: update these two IDs when the recommended models change.
# Users: `codex-home model-settings` prints your PERSONAL settings file.
# Edit that file, then run `codex-home apply-model-settings`.
# To adopt this repository template, run `codex-home reset-umgpt-defaults`.
#
# This is not a model catalog. `codex-home models umgpt` and
# `codex-home models umgpt-low` query the U-M Toolkit gateway live.
# The normal identity accepts GPT and o-series text IDs; the low-sensitivity
# identity accepts general text IDs while excluding image and embedding IDs.

umgpt = "gpt-6-luna"
umgpt_low = "gpt-6-luna"

# The default stays first. List favorites below in your preferred order.
# Remaining models follow by family/version. Keep each array on one line.
# Example: umgpt_order = ["gpt-6-sol", "gpt-6-astra", "o3"]
# Example: umgpt_low_order = ["claude-sonnet-5", "gemini-3.8-flash", "claude-haiku-4-5"]
umgpt_order = []
umgpt_low_order = []
